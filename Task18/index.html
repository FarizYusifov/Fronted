<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Table</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-900 min-h-screen flex justify-center items-start p-10">

    <div class="w-full max-w-2xl">

        <input id="search" type="text" placeholder="Search by name or ticker..."
            class="w-full mb-4 px-4 py-3 rounded-lg outline-none bg-white text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-blue-500">

        <div class="bg-white rounded-xl shadow-xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 text-slate-500 text-sm">
                    <tr>
                        <th class="px-6 py-4">Name</th>
                        <th class="px-6 py-4 text-right">Value</th>
                        <th class="px-6 py-4 text-right">Change</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

    </div>
    <script src="./script.js"></script>
</body>

</html>
